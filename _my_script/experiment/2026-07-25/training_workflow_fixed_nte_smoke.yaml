# Small NTE model used only to validate fixed-workflow save/resume mechanics.
dataset:
  dataset_name: nablaDFT
  dbpath: /dataset/seongsu/shared-home/datasets/nablaDFT/hamiltonian_databases/train_2k.db
  output_folder: /dataset/seongsu/shared-home/workspace/project/outputs/training-workflow-fixed-smoke
  run_name: training-workflow-fixed-smoke
  open_shell: false

execution:
  train_or_eval: train
  train_backbone: true
  train_head: true
  compute_total_energy: false

splits:
  num_train: 4
  num_val: 2
  num_test: 0
  batch_size: 1
  shuffle: false
  distribute_graphs: false

model:
  model_variant: maloq-nte-fixed-workflow-smoke
  backbone_type: esen
  head_type: maloq_muon
  wigner_backend: torch
  l_embedding_dim: 16
  hidden_dim: 16
  output_l_embedding_dim: 8
  num_distance_basis: 16
  num_mp_layers: 1
  num_edge_layers: 1
  rcut_orbitals: 8.0
  rcut_gaussian: 16.0
  gaussian_width: 1.0
  reduce_edge: false
  reduce_node: true
  reduce_node_intra: true
  gate_act_type: sigmoid
  mlp_type: grid
  message_passing_schedule: node_then_edge
  use_edge_envelope: true
  use_edge_scalar_modulation: true
  residual_update_scale_mode: bounded_degree
  residual_update_scale_init: 0.015625
  residual_update_scale_log_range: 4.1588830833596715

optimization:
  num_epochs: 2
  lr_init: 0.0005
  optimizer_type: muon
  weight_decay: 0.0001
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_adamw_lr: 0.0005
  muon_adamw_betas: [0.9, 0.95]
  muon_adamw_eps: 1.0e-10
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 1
  scheduler_type: warmup_polynomial
  warmup_steps: 4
  scheduler_power: 1.0
  min_lr_ratio: 0.0
  step_every_epoch: false

loss:
  loss_target: fock_matrix
  train_loss: rmse_mse_padded_loss
  test_loss: l1_unpadded_loss
  scale_and_shift: false

checkpointing:
  save_frequency: 1
  restart_backbone: false
  restart_head: false
  restart_optimizer: false
  backbone_checkpoint: backbone.pt
  head_checkpoint: head.pt

runtime:
  dtype: float32
  seed: 44

tracking:
  use_wandb: false
  wandb_project: maloq-nablaDFT
  wandb_entity: kaist-korea
  wandb_mode: online
  wandb_run_name: "NablaDFT | NTE tiny | Fixed resume smoke"
  wandb_group: nabla-fixed-resume-smoke
  wandb_job_type: smoke
  wandb_tags: [dataset:nabladft, workflow:fixed-resume, scope:smoke, sc26-seongsu]
  experiment_version: 1
  wandb_log_every_n_steps: 10
  validation_matrix_metrics: false
  validation_matrix_metrics_frequency: 1
