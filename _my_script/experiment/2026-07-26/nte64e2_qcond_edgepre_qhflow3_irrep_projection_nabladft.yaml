# Recurrent NTE combining QHFlow3's edge norm boundary and irrep output projection.
dataset:
  dataset_name: nablaDFT
  dbpath: /dataset/seongsu/shared-home/datasets/nablaDFT/hamiltonian_databases/train_2k.db
  output_folder: /dataset/seongsu/shared-home/workspace/project/outputs/nabla-nte64-qcond-edgepre-qhfproj-v1
  run_name: nabla-nte64-qcond-edgepre-qhfproj-v1
  open_shell: false

execution:
  train_or_eval: train
  train_backbone: true
  train_head: true
  compute_total_energy: false

splits:
  num_train: 12081
  num_val: 64
  num_test: 0
  batch_size: 5
  shuffle: false
  distribute_graphs: false

model:
  model_variant: nte64e2-qcond-edgepre-qhflow3-irrep-projection
  backbone_type: esen
  head_type: maloq_muon
  wigner_backend: torch
  l_embedding_dim: 128
  hidden_dim: 128
  output_l_embedding_dim: 64
  num_distance_basis: 512
  num_mp_layers: 3
  num_edge_layers: 2
  rcut_orbitals: 8.0
  rcut_gaussian: 16.0
  gaussian_width: 1.0
  reduce_edge: false
  reduce_node: true
  reduce_node_intra: true
  gate_act_type: sigmoid
  mlp_type: grid
  message_type: source-target
  message_passing_schedule: node_then_edge
  use_edge_envelope: true
  use_edge_scalar_modulation: true
  residual_update_scale_mode: bounded_degree
  residual_update_scale_init: 0.015625
  residual_update_scale_log_range: 4.1588830833596715
  unscaled_node_layers: []
  repeat_system_embedding_each_node_block: false
  node_stack_mode: nte
  edge_stack_mode: recurrent
  direct_edgewise_layers: []
  edge_atomwise_output_mode: residual_scaled
  edge_norm1_position: pre_node
  nte_input_conditioning: qhflow3_exact
  nte_output_projection_mode: qhflow3_irrep_linear

optimization:
  num_epochs: 20
  lr_init: 0.0005
  optimizer_type: muon
  weight_decay: 0.0001
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_adamw_lr: 0.0005
  muon_adamw_betas: [0.9, 0.95]
  muon_adamw_eps: 1.0e-10
  muon_output_projection_policy: shape_muon
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 2
  scheduler_type: warmup_polynomial
  warmup_steps: 1000
  scheduler_power: 1.0
  min_lr_ratio: 0.0
  step_every_epoch: false

loss:
  loss_target: fock_matrix
  train_loss: rmse_mse_padded_loss
  test_loss: l1_unpadded_loss
  scale_and_shift: false

checkpointing:
  save_frequency: 1
  restart_backbone: false
  restart_head: false
  restart_optimizer: false
  backbone_checkpoint: backbone.pt
  head_checkpoint: head.pt

runtime:
  dtype: float32
  seed: 44

tracking:
  use_wandb: true
  wandb_project: maloq-nablaDFT
  wandb_entity: kaist-korea
  wandb_mode: online
  wandb_run_name: "NablaDFT | NTE-64/2 | MatrixMuon+AuxAdamW | RAW | QHFcond | EdgePre+QHFProj | V1"
  wandb_group: nabla-nte64-output-projection-ablation-v1
  wandb_job_type: full
  wandb_tags: [dataset:nabladft, model:nte64e2, head:matrixmuon-auxadamw, target:raw, conditioning:qhflow3-exact, node-stack:nte, edge-stack:recurrent, edge-norm1-position:pre-node, output-projection:qhflow3-irrep-linear, projection-rng:so3-baseline-aligned, ablation:edgepre-output-projection-factorial, baseline:fao0946w, edgepre-reference:3uq7prdf, qhflow3-reference:aeorq52s, version:v1, sc26-seongsu]
  experiment_version: 1
  wandb_log_every_n_steps: 10
  validation_matrix_metrics: true
  validation_matrix_metrics_frequency: 1
