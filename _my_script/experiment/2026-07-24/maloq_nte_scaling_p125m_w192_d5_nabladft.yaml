# MALOQ-NTE Muon-head scaling point: 125,004,341 parameters.
dataset:
  dataset_name: nablaDFT
  dbpath: /dataset/seongsu/shared-home/datasets/nablaDFT/hamiltonian_databases/train_2k.db
  output_folder: /dataset/seongsu/shared-home/workspace/project/outputs/nabla-nte-scale-p125m-w192-d5-v1
  run_name: nabla-nte-scale-p125m-w192-d5-v1
  open_shell: false

execution:
  train_or_eval: train
  train_backbone: true
  train_head: true
  compute_total_energy: false

splits:
  num_train: 12081
  num_val: 64
  num_test: 0
  batch_size: 2
  shuffle: false
  distribute_graphs: false

model:
  model_variant: maloq-nte-scale-p125m-w192-d5-muon-head-nabladft
  backbone_type: esen
  head_type: maloq_muon
  wigner_backend: torch
  l_embedding_dim: 192
  hidden_dim: 192
  output_l_embedding_dim: 192
  num_distance_basis: 512
  num_mp_layers: 5
  num_edge_layers: 5
  rcut_orbitals: 8.0
  rcut_gaussian: 16.0
  gaussian_width: 1.0
  reduce_edge: false
  reduce_node: true
  reduce_node_intra: true
  gate_act_type: sigmoid
  mlp_type: grid
  message_passing_schedule: node_then_edge
  use_edge_envelope: true
  use_edge_scalar_modulation: true
  residual_update_scale_mode: bounded_degree
  residual_update_scale_init: 0.015625
  residual_update_scale_log_range: 4.1588830833596715

optimization:
  num_epochs: 20
  lr_init: 0.0005
  optimizer_type: muon
  weight_decay: 0.0001
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_adamw_lr: 0.0005
  muon_adamw_betas: [0.9, 0.95]
  muon_adamw_eps: 1.0e-10
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 5
  scheduler_type: warmup_polynomial
  warmup_steps: 1000
  scheduler_power: 1.0
  min_lr_ratio: 0.0
  step_every_epoch: false

loss:
  loss_target: fock_matrix
  train_loss: rmse_mse_padded_loss
  test_loss: l1_unpadded_loss
  scale_and_shift: false

checkpointing:
  save_frequency: 1
  restart_backbone: false
  restart_head: false
  restart_optimizer: false
  backbone_checkpoint: backbone.pt
  head_checkpoint: head.pt

runtime:
  dtype: float32
  seed: 44

tracking:
  use_wandb: true
  wandb_project: maloq-nablaDFT
  wandb_entity: kaist-korea
  wandb_mode: online
  wandb_run_name: "NablaDFT | NTE Scaling | 125M | W192 D5 | V1"
  wandb_group: nabla-nte-muon-scaling
  wandb_job_type: full
  wandb_tags: [dataset:nabladft, model:maloq-nte, head:muon, scaling-law, params:125m, width:192, depth:5, normalization:none, target:raw, scale-shift:off, seed:44, version:v1, sc26-seongsu]
  experiment_version: 1
  wandb_log_every_n_steps: 10
  validation_matrix_metrics: true
  validation_matrix_metrics_frequency: 1
