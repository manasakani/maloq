# QH9Stable V2 QHFlow3 with equivariant Grid48 and less aggressive FFN chunking.
dataset:
  dataset_name: QM7
  dbpath: /dataset/seongsu/shared-home/data/QH9_maloq_ase/QH9Stable_random.db
  output_folder: /dataset/seongsu/shared-home/workspace/project/outputs/qh9stable-v2-qhflow3-template
  run_name: qh9stable-v2-qhflow3-template
  open_shell: false

execution:
  train_or_eval: train
  train_backbone: true
  train_head: true
  compute_total_energy: false

splits:
  num_train: 104664
  num_val: 13083
  num_test: 13084
  batch_size: 16
  shuffle: false
  distribute_graphs: false

model:
  model_variant: qh9stable-v2-qhflow3-grid48-chunk1024
  backbone_type: qhflow3
  head_type: maloq_muon
  l_embedding_dim: 128
  hidden_dim: 128
  output_l_embedding_dim: 64
  num_distance_basis: 512
  num_mp_layers: 3
  num_edge_layers: 2
  # The loader creates exactly the same local directed matrix-pair graph used
  # by MALOQ. QHFlow3 does not perform an additional edge top-k/truncation.
  rcut_orbitals: 7.5
  rcut_gaussian: 15.0
  qhflow3_max_radius: 12.0
  qhflow3_radius_embed_dim: 32
  # Grid48 is retained because the lower native grid failed the established
  # float32 general-rotation equivariance tolerance.
  qhflow3_grid_resolution: 48
  # 512 forced checkpoint/recompute for typical ~700-edge QH9 batches.
  # 1024 avoids that on ordinary batches while bounding larger molecules.
  qhflow3_grid_ffn_chunk_size: 1024
  qhflow3_use_overlap: true
  qhflow3_muonize_output_projection: true
  reduce_edge: false
  reduce_node: true
  reduce_node_intra: true

optimization:
  num_epochs: 80
  lr_init: 0.0005
  optimizer_type: muon
  weight_decay: 0.0001
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_adamw_lr: 0.0005
  muon_adamw_betas: [0.9, 0.95]
  muon_adamw_eps: 1.0e-10
  gradient_clip_val: 1.0
  gradient_accumulation_steps: 2
  scheduler_type: warmup_polynomial
  warmup_steps: 1000
  scheduler_power: 1.0
  min_lr_ratio: 0.0
  step_every_epoch: false

loss:
  loss_target: fock_matrix
  train_loss: rmse_mse_padded_loss
  test_loss: l1_unpadded_loss
  scale_and_shift: false

checkpointing:
  save_frequency: 1
  restart_backbone: false
  restart_head: false
  restart_optimizer: false
  backbone_checkpoint: backbone.pt
  head_checkpoint: head.pt

runtime:
  dtype: float32
  seed: 44

tracking:
  use_wandb: true
  wandb_project: maloq-qh9
  wandb_entity: kaist-korea
  wandb_mode: online
  wandb_run_name: "QH9Stable | TARGET | QHFlow3 | Muon | Grid48+Chunk1024 | V2"
  wandb_group: qh9stable-v2-reset-20260727
  wandb_job_type: full
  wandb_tags: [dataset:qh9stable, model:qhf3, head:muon, grid:48x48, grid-ffn-chunk:1024, output-projection:muon, delta-learning:on, seed:44, version:v2, reset:20260727, sc26-seongsu]
  experiment_version: 2
  wandb_log_every_n_steps: 10
  validation_matrix_metrics: true
  validation_matrix_metrics_frequency: 1
