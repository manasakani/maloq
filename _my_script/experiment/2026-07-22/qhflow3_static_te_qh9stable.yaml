# Corrected static tensor-expansion head on the headless QHFlow3 trunk.
dataset:
  dataset_name: QM7
  dbpath: /dataset/seongsu/shared-home/data/QH9_maloq_ase/QH9Stable_random.db
  output_folder: outputs/qhflow3-static-te-path-offsets-qh9-seed44
  run_name: qhflow3-static-te-path-offsets-qh9-seed44
  open_shell: false

execution:
  train_or_eval: train
  train_backbone: true
  train_head: true
  compute_total_energy: false

splits:
  num_train: 104664
  num_val: 13083
  num_test: 13084
  batch_size: 32
  shuffle: false
  distribute_graphs: false

model:
  model_variant: qhflow3-static-te-path-offsets
  backbone_type: qhflow3_clean
  head_type: static_te
  static_te_init_mode: zero
  static_te_init_std: 1.0
  l_embedding_dim: 128
  hidden_dim: 128
  output_l_embedding_dim: 64
  num_distance_basis: 512
  num_mp_layers: 3
  num_edge_layers: 2
  rcut_orbitals: 7.5
  rcut_gaussian: 15.0
  qhflow3_max_radius: 12.0
  qhflow3_radius_embed_dim: 32
  qhflow3_grid_resolution: 48
  qhflow3_grid_ffn_chunk_size: 512
  reduce_edge: false
  reduce_node: true
  reduce_node_intra: true

optimization:
  num_epochs: 80
  lr_init: 0.0005
  optimizer_type: muon
  weight_decay: 0.0001
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_adamw_lr: 0.0005
  muon_adamw_betas: [0.9, 0.95]
  muon_adamw_eps: 1.0e-10
  scheduler_type: warmup_polynomial
  warmup_steps: 1000
  scheduler_power: 1.0
  min_lr_ratio: 0.0
  gradient_clip_val: 1.0
  step_every_epoch: false

loss:
  loss_target: fock_matrix
  train_loss: rmse_mse_padded_loss
  test_loss: l1_unpadded_loss
  scale_and_shift: false

checkpointing:
  save_frequency: 1
  restart_backbone: false
  restart_head: false
  restart_optimizer: false
  backbone_checkpoint: backbone.pt
  head_checkpoint: head.pt

runtime:
  dtype: float32
  seed: 44

tracking:
  use_wandb: false
  wandb_project: maloq-qh9
  wandb_mode: online
  wandb_log_every_n_steps: 10
  validation_matrix_metrics: true
  validation_matrix_metrics_frequency: 1
