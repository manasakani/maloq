# QH9 B3LYP5 density-delta NTE with equivariant scalar L3/L4 head gates.
dataset:
  dataset_name: QM7
  dbpath: /dataset/seongsu/shared-home/data/QH9_maloq_ase/QH9StableMatrices_random.db
  output_folder: outputs/qh9-nte-static-l34-gate-seed42
  run_name: qh9_b3lyp5_maloq0713_nte_corrected_static_degreewise_l34_gate_muon_full_seed42
  open_shell: false

execution:
  train_or_eval: train
  train_backbone: true
  train_head: true
  compute_total_energy: false

splits:
  num_train: 104664
  num_val: 13083
  num_test: 13084
  batch_size: 32
  shuffle: false
  distribute_graphs: false

model:
  model_variant: nte-corrected-static-degreewise-l34-gate
  backbone_type: esen
  head_type: static_te
  static_te_init_mode: zero
  static_te_init_std: 1.0
  static_te_gate_degrees: [3, 4]
  static_te_gate_activation: residual_tanh
  static_te_gate_init: 1.0
  wigner_backend: torch
  l_embedding_dim: 128
  hidden_dim: 128
  output_l_embedding_dim: 64
  num_distance_basis: 512
  num_mp_layers: 3
  num_edge_layers: 2
  rcut_orbitals: 7.5
  rcut_gaussian: 15.0
  gaussian_width: 1.0
  reduce_edge: false
  reduce_node: true
  reduce_node_intra: true
  gate_act_type: sigmoid
  mlp_type: grid
  message_passing_schedule: node_then_edge
  use_edge_envelope: true
  use_edge_scalar_modulation: true
  residual_update_scale_mode: none
  residual_update_scale_init: 1.0
  residual_update_scale_log_range: 0.0

optimization:
  num_epochs: 80
  lr_init: 0.0005
  optimizer_type: muon
  weight_decay: 0.0001
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_adamw_lr: 0.0005
  muon_adamw_betas: [0.9, 0.95]
  muon_adamw_eps: 1.0e-10
  gradient_clip_val: 1.0
  scheduler_type: warmup_polynomial
  warmup_steps: 1000
  scheduler_power: 1.0
  min_lr_ratio: 0.0
  step_every_epoch: false

loss:
  loss_target: density_matrix
  train_loss: rmse_mse_padded_loss
  test_loss: l1_unpadded_loss
  scale_and_shift: false
  delta_learning: true

checkpointing:
  save_frequency: 1
  restart_backbone: false
  restart_head: false
  restart_optimizer: false
  backbone_checkpoint: backbone.pt
  head_checkpoint: head.pt

runtime:
  dtype: float32
  seed: 42

tracking:
  use_wandb: true
  wandb_project: maloq-qh9
  wandb_entity: kaist-korea
  wandb_mode: online
  wandb_log_every_n_steps: 10
  validation_matrix_metrics: true
  validation_matrix_metrics_frequency: 1
