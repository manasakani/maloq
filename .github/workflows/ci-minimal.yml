name: CI Minimal Install

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  install-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install MALOQ dependencies and package
        run: |
          python -m pip install "fairchem-core==2.21" --ignore-requires-python --no-deps
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
          python -m pip install --editable ".[dev]"

      - name: Installation smoke test
        run: |
          python - <<'PY'
          import maloq
          import maloq.dataset_utils
          import maloq.fock_utils
          import maloq.helm
          import maloq.train_utils
          print("MALOQ import smoke test passed")
          PY

